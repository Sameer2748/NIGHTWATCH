version: '3.8'

services:
  # ----------------------------
  # Infrastructure (DB + Redis)
  # ----------------------------
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ----------------------------
  # Application Services
  # ----------------------------
  
  # 1. API Backend
  backend:
    build: .
    restart: always
    command: sh -c "cd packages/db && bunx prisma db push && cd ../../apps/backend && bun run dev"
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - postgres
      - redis

  # 2. Producer (Schedules checks)
  producer:
    build: .
    restart: always
    command: sh -c "cd apps/producer && bun run dev"
    env_file: .env
    depends_on:
      - postgres
      - redis

  # 3. Worker (Executes checks)
  worker:
    build: .
    restart: always
    command: sh -c "cd apps/worker && bun run dev"
    env_file: .env
    depends_on:
      - postgres
      - redis

  # 4. Notifier (Sends alerts)
  notifier:
    build: .
    restart: always
    command: sh -c "cd apps/notifier && bun run dev"
    env_file: .env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
